name: Build app ZIPs

# Snuggery imports an app as one ZIP, so every app folder here gets one at
# zips/<folder>.zip with a stable raw URL. Getting the app onto a phone is then
# a matter of opening that address in Safari and sharing it to Snuggery.
#
# The path filter deliberately EXCLUDES every data file. Without the exclusion
# this job rebuilds all the ZIPs every time a refresh commits a snapshot —
# hourly, forever, for no reason, and the app inside them never changed.

on:
  push:
    paths:
      - '*/**'
      - '!*/data/**'
      - '!.github/**'
      - '!scripts/**'
      - '!zips/**'
      - '!README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zips
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Any top-level directory holding an index.html is an app. Adding app
      # number two therefore needs no edit to this file.
      - name: Zip every app folder
        run: |
          mkdir -p zips
          for dir in */; do
            name="${dir%/}"
            case "$name" in .github|scripts|zips) continue ;; esac
            [ -f "$name/index.html" ] || continue
            rm -f "zips/$name.zip"
            # The folder ships whole, data file included, so a freshly
            # imported app is not blank — but not the dotfiles. A .gitkeep is
            # scaffolding for this repository and has no business inside an
            # app somebody installs.
            (cd "$name" && zip -q -r -X "../zips/$name.zip" . -x '.*' '*/.*')
            echo "packed $name"
          done

      - name: Commit the ZIPs, only if they changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zips
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Rebuild app ZIPs"
          # Another workflow may have pushed to main between this job's checkout
          # and now — the ZIP builder, or another app's refresh on the same
          # cron. They never touch the same file, so rebase and retry rather
          # than failing: a lost refresh is a stale dashboard nobody notices.
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected; rebasing and retrying in $((2 ** i))s"
            sleep $((2 ** i))
            # -X theirs: when the other run touched the SAME file, keep this
            # run's copy — both are seconds old, and a conflict on a generated
            # file is not a conflict. Seen on the first scheduled run here, which
            # raced a manual dispatch and died in the rebase.
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "another run refreshed it seconds ago; nothing left to do"
              exit 0
            fi
          done
          echo "could not push after 4 attempts" >&2
          exit 1
