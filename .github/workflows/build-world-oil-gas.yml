name: Build World Oil & Gas data

# Rebuilds the World Oil & Gas app's data files: the country choropleth from Our World in Data's
# energy dataset (which carries the Energy Institute Statistical Review, CC BY 4.0), the
# 1:110m Natural Earth countries, and — if a Global Oil and Gas Extraction Tracker workbook has
# been dropped into world-oil-gas/raw/manual/ — the field points. Nothing here needs a key.
#
# Yearly, because the Energy Institute publishes once a year (June) and OWID follows within
# weeks; run it by hand after dropping in a new GOGET release. schedule: only runs from main.

on:
  schedule:
    - cron: '17 6 1 7,9 *'                    # 1 July and 1 September: catches the EI edition and OWID's update
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/shelf_atlas/build_world.py'
      - 'scripts/shelf_atlas/common.py'
      - 'world-oil-gas/raw/manual/**'
      - '.github/workflows/build-world-oil-gas.yml'

permissions:
  contents: write

concurrency:
  group: build-world-oil-gas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the spreadsheet reader
        run: python3 -m pip install --quiet 'openpyxl>=3.1'

      - name: Build
        run: |
          set -euo pipefail
          python3 -m scripts.shelf_atlas.build_world --out world-oil-gas/data --manual world-oil-gas/raw/manual --refresh
          ls -la world-oil-gas/data

      - name: Commit the data, only if it changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-oil-gas/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "world-oil-gas: data refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push rejected; rebasing and retrying in $((2 ** i))s"
            sleep $((2 ** i))
            if ! git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "another run refreshed it seconds ago; nothing left to do"
              exit 0
            fi
          done
          echo "could not push after 4 attempts" >&2
          exit 1
