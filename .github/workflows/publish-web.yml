name: Publish apps to the web

# Every app here, openable in any browser at
#   https://<owner>.github.io/<repo>/<app-folder>/
# with an index of them all at https://<owner>.github.io/<repo>/.
#
# It commits nothing and writes no branch; the ZIP builder and every refresh job
# run exactly as before. It copies each app folder less what the ZIP leaves out
# (see scripts/build_web.py), packs each one as a ZIP with the same data, and
# hands the result to GitHub Pages: the apps at <app-folder>/, their ZIPs at
# zips/<app-folder>.zip.
#
# Why the ZIPs are packed here as well as on main: main's zips/ is rebuilt on a
# CODE push only, so a ZIP from there carries the data of the last code push
# (or, for the apps whose live data is on a data-<app> branch, the demo). A ZIP
# packed here carries the data this run publishes, which is the newest. It is
# not committed, so the repository's history does not grow by a binary on every
# refresh: a ZIP does not delta, and Global Weather's alone, six times a day,
# would add gigabytes a year. main's zips/ stays as it is: the code build, and
# the only ZIPs a private copy without Pages has.
#
# OFF UNTIL YOU TURN IT ON. Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Until then every run says so in one line and stops, green.
# A Pages site is PUBLIC even when the repository is private (bar Enterprise
# plans), so in a private copy holding real data — Running Dashboard, Finances —
# leave it off, or delete this file.
#
# Why it listens to other workflows: a refresh commits with the job's own
# token, and a push made with that token starts no workflow. `workflow_run` is
# the one event that does fire after them, so the site follows the data.

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Refresh hello-live
      - Refresh world-news
      - Refresh power-hours
      - Refresh Finances
      - Refresh global-wind
      - Refresh global-weather
      - Refresh us-quakes
      - Refresh warming-world
      - Build Shelf Atlas data
      - Build World Oil & Gas data
      - Build US Quakes data
      - Pull Garmin data for Running Dashboard
      - Rebuild Norne reservoir data
      - Build app ZIPs
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write                    # deploy the site, and ask whether Pages is on
  id-token: write                 # deploy-pages proves who is deploying with it

concurrency:
  group: publish-web
  cancel-in-progress: true        # a newer run carries newer data; the older is moot

jobs:
  publish:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest becomes Ubuntu 26 from 2026-10-19; move on purpose, after a test run
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is Pages turned on, from Actions?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build" = "workflow" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser copies are off. To publish them, Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi

      - uses: actions/checkout@v5
        if: steps.pages.outputs.on == 'true'
        with:
          ref: main               # the newest data, whichever event started this

      # Global Wind, Global Weather, US Quakes and Warming World publish their live data to a
      # branch of their own; `main` holds only the demo the code ZIP ships with. Every file the
      # branch holds under <app>/data/ is written over this job's checkout (never committed or
      # pushed), so the browser copy and its ZIP both take the live data when there is some, the
      # demo when there is not. A fingerprint the demo keeps beside its snapshot
      # (snapshot.sha256) that no longer matches the file is dropped rather than shipped false.
      - name: Take the live data from their data branches
        if: steps.pages.outputs.on == 'true'
        run: |
          for app in global-wind global-weather us-quakes warming-world; do
            [ -f "$app/index.html" ] || continue
            if git fetch --quiet --depth=1 origin "data-$app" 2>/dev/null \
               && files=$(git ls-tree -r --name-only FETCH_HEAD -- "$app/data/") && [ -n "$files" ]; then
              git archive FETCH_HEAD -- "$app/data/" | tar -x
              for sum in "$app"/data/*.sha256; do
                [ -f "$sum" ] || continue
                (cd "$app/data" && sha256sum --status -c "$(basename "$sum")") && continue
                rm "$sum"
                echo "$app: dropped $(basename "$sum"), the demo's fingerprint"
              done
              echo "$app: live data from data-$app:" $files
            else
              echo "$app: no data branch yet, keeping the demo"
            fi
          done

      - name: Build the site
        if: steps.pages.outputs.on == 'true'
        run: python3 scripts/build_web.py --out _site

      # One ZIP per app the site publishes, packed from the same folder the browser copy
      # was copied from, with the same zip line as build-zips.yml (keep the two in step):
      # so a ZIP here is the code ZIP with this run's data inside it, nothing added.
      - name: Pack every app as a ZIP, with the data it was published with
        if: steps.pages.outputs.on == 'true'
        run: |
          mkdir -p _site/zips
          for page in _site/*/index.html; do
            name=$(basename "$(dirname "$page")")
            [ -f "$name/index.html" ] || continue
            (cd "$name" && zip -q -r -X "../_site/zips/$name.zip" . -x '.*' '*/.*' 'screenshots/*' 'tools/*' 'pipeline/*' 'scripts/*' 'dist/*' 'raw/*')
            echo "packed $name: $(wc -c < "_site/zips/$name.zip") bytes"
          done

      # The apps Snuggery does not install itself, in one file, to add them all at once. Snuggery
      # 1.2 and later import a ZIP whose entries are app ZIPs as a folder of apps; 1.1 imports it as
      # a folder of .zip files, which is why nothing links to it until 1.2 is out.
      # - The seven in IN_APP come with Snuggery (Create → Install the live examples, into a Live
      #   examples folder), so they stay out. A second copy in another folder would keep its own
      #   saved data, and a Shortcut that refreshes an app by name updates only the first it finds.
      # - The members sit in one top folder, which names the Library folder they land in. Importing
      #   the next bundle into the same place then asks once about every app, and Replace keeps what
      #   each one saved, whatever the download was renamed to.
      # - Stored, not compressed: each member is a ZIP already.
      # - Past the importer's bundle ceilings (64 apps; 20,000 files or 1 GiB unpacked, summed) the
      #   app would refuse it whole, so it is left out with a warning rather than failing the publish.
      - name: Pack the apps Snuggery does not install itself into one bundle
        if: steps.pages.outputs.on == 'true'
        env:
          IN_APP: hello-live world-news power-hours global-wind outdoor-window running-dashboard finances
        run: |
          rm -rf _bundle && mkdir -p "_bundle/More examples"
          for zip in _site/zips/*.zip; do
            case " $IN_APP " in *" $(basename "$zip" .zip) "*) continue ;; esac
            cp "$zip" "_bundle/More examples/"
          done
          fits=0
          python3 - "_bundle/More examples" <<'PY' || fits=$?
          import pathlib, sys, zipfile
          apps = sorted(pathlib.Path(sys.argv[1]).glob("*.zip"))
          entries = [e for app in apps for e in zipfile.ZipFile(app).infolist()]
          unpacked = sum(e.file_size for e in entries)
          print(f"bundle: {len(apps)} apps, {len(entries)} entries and {unpacked} bytes unpacked")
          sys.exit(4 if not apps else 0 if len(apps) <= 64 and len(entries) <= 20000 and unpacked <= 1 << 30 else 3)
          PY
          if [ "$fits" = 0 ]; then
            (cd _bundle && zip -q -0 -X ../_site/zips/more-examples.zip "More examples/" "More examples/"*.zip)
            echo "bundle: $(wc -c < _site/zips/more-examples.zip) bytes"
          elif [ "$fits" = 3 ]; then
            echo "::warning::The bundle is past what Snuggery imports in one go (64 apps; 20,000 files or 1 GiB unpacked), so only each app's own ZIP was published"
          elif [ "$fits" = 4 ]; then
            echo "No app here that Snuggery does not install itself, so no bundle"
          else
            exit "$fits"
          fi
          rm -rf _bundle

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.on == 'true'
        with:
          path: _site

      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@v4
