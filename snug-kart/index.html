<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Snug Kart</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl" aria-label="The race"></canvas>
<canvas id="lines" aria-hidden="true"></canvas>
<div id="fade" aria-hidden="true"></div>

<!-- The game's touch layer: the steering pad or the two sides. -->
<div id="touch" aria-hidden="true">
  <div id="pad" hidden><div id="pad-knob"></div></div>
  <div id="pad-ghost" hidden><span>Steer</span></div>
  <div id="sides-hint"><span>Left</span><span>Right</span></div>
</div>

<div id="hud" hidden>
  <!-- Top left: place, lap and times. The top-right corner is left clear for Snuggery's own
       exit-full-screen button; the mini-map starts below it. -->
  <div id="topleft">
    <div id="pos" aria-live="polite"><span id="pos-n">5</span><span id="pos-suf">th</span><span id="pos-of"> / 8</span></div>
    <div id="lapbox">
      <div id="lap">Lap 1/3</div>
      <div id="rtime" title="Tap five times for diagnostics">0:00.000</div>
      <div id="last"></div>
    </div>
  </div>
  <button id="btn-pause" class="round" aria-label="Pause"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1"/><rect x="11.6" y="4" width="3.4" height="12" rx="1"/></svg></button>
  <canvas id="minimap" aria-label="Map"></canvas>
  <div id="diag" hidden></div>
  <div id="count" hidden></div>
  <div id="hint" hidden></div>
  <div id="banner"></div>
  <div id="reticle" hidden><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="13" fill="none" stroke-width="3"/><path d="M18 1v8M18 27v8M1 18h8M27 18h8" stroke-width="3"/></svg></div>
  <div id="warn" hidden><svg class="icon" aria-hidden="true"><use href="#i-plane"/></svg>Plane behind</div>
  <button id="btn-item" class="round" aria-label="Use item"><svg class="icon" aria-hidden="true"><use id="item-use"/></svg></button>
  <button id="btn-drift" class="round" aria-label="Drift">Drift</button>
</div>

<section id="loading" class="screen">
  <div class="panel center">
    <div class="wordmark small">Snug Kart</div>
    <p id="load-msg">Warming up the engines…</p>
  </div>
</section>

<section id="title" class="screen" hidden>
  <header class="title-top">
    <h1 class="wordmark">Snug Kart</h1>
    <p class="tagline">Three laps. Seven rivals. One cosy town.</p>
  </header>
  <div class="panel title-panel">
    <div class="track-card" id="track-card">
      <button class="nav" id="track-prev" aria-label="Previous track">‹</button>
      <div class="track-info">
        <div class="track-name" id="track-name"></div>
        <div class="track-blurb" id="track-blurb"></div>
        <div class="track-meta" id="track-meta"></div>
      </div>
      <button class="nav" id="track-next" aria-label="Next track">›</button>
    </div>
    <div class="racer-grid" id="racer-grid" role="radiogroup" aria-label="Racer"></div>
    <p class="racer-line" id="racer-line"></p>
    <div class="chips" id="chips"></div>
    <p class="chip-note" id="chip-note"></p>
    <button class="big" id="btn-race">Race</button>
  </div>
</section>

<section id="building" class="screen" hidden>
  <div class="panel center"><p>Building the track…</p></div>
</section>

<section id="pause" class="screen dim" hidden>
  <div class="panel center">
    <h2>Paused</h2>
    <button class="big" id="btn-resume">Resume</button>
    <button class="plain" id="btn-restart">Restart</button>
    <button class="plain" id="btn-quit">Quit to title</button>
  </div>
</section>

<section id="lost" class="screen dim" hidden>
  <div class="panel center"><p>Graphics were reset — tap to continue.</p></div>
</section>

<section id="results" class="screen dim" hidden>
  <div class="panel results-panel">
    <h2 id="res-title">Results</h2>
    <div id="res-badges"></div>
    <ol id="res-list"></ol>
    <div class="res-buttons">
      <button class="big" id="btn-again">Race again</button>
      <button class="plain" id="btn-change">Change track or racer</button>
    </div>
  </div>
</section>

<!-- The five item icons, original symbols drawn for this game. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-kettle" viewBox="0 0 48 48"><path d="M14 18h20l3 20a3 3 0 0 1-3 3H14a3 3 0 0 1-3-3z" fill="#E8EEF2" stroke="#2A2622" stroke-width="2.5"/><path d="M18 18c0-5 3-8 6-8s6 3 6 8" fill="none" stroke="#2A2622" stroke-width="2.5"/><path d="M36 24l7-5v5l-6 5" fill="#E8EEF2" stroke="#2A2622" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 12c2-2 0-4 2-6M44 14c2-2 0-4 2-6" stroke="#9BC7E0" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-quilt" viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32" rx="4" fill="#F4B6C2" stroke="#2A2622" stroke-width="2.5"/><path d="M24 8v32M8 24h32" stroke="#2A2622" stroke-width="2" stroke-dasharray="3 3"/><rect x="11" y="11" width="10" height="10" rx="2" fill="#FFF1D6"/><rect x="27" y="27" width="10" height="10" rx="2" fill="#FFF1D6"/></symbol>
  <symbol id="i-yarn" viewBox="0 0 48 48"><circle cx="22" cy="24" r="14" fill="#E0607E" stroke="#2A2622" stroke-width="2.5"/><path d="M12 16c8 2 14 10 16 21M10 26c8-2 16 2 22 9M18 11c6 5 10 13 10 23" fill="none" stroke="#FFE3EA" stroke-width="2"/><path d="M34 32c4 2 6 6 8 8" fill="none" stroke="#E0607E" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="i-plane" viewBox="0 0 48 48"><path d="M5 24L43 8 30 40l-6-12z" fill="#FFFFFF" stroke="#2A2622" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 28L43 8" stroke="#2A2622" stroke-width="2"/></symbol>
  <symbol id="i-honey" viewBox="0 0 48 48"><path d="M10 12h28v6c0 4-3 4-3 8v10a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4V26c0-4-3-4-3-8z" fill="#F2B632" stroke="#2A2622" stroke-width="2.5"/><path d="M16 12v9c0 2 3 2 3 0v-3c0-2 3-2 3 0v6c0 2 3 2 3 0v-12" fill="#FFD27A"/><rect x="8" y="8" width="32" height="5" rx="2" fill="#C98A2E" stroke="#2A2622" stroke-width="2"/></symbol>
</svg>

<script type="module" src="js/main.js"></script>
</body>
</html>
