# Earth's History — the words: period cards, events, "look for" pins and their sources.
#
# Hand-written; validated and converted to data/story.json by tools/60_story.py (tools/CONTRACT.md §10).
# This file lives under tools/ so it never ships inside the app's ZIP; story.json carries everything
# the app shows. Rules (60_story.py enforces what a script can):
#
#   * Every number in a text, title, label or `when` is a key in that item's `numbers`, mapped to a
#     source id the item cites. Every event's age has an `age_source`.
#   * Every source was checked against Crossref (title, authors, journal, volume, pages) on
#     2026-09-30, and every number was read from the source's abstract, its title, its open full text,
#     or the pinned data files the pipeline ships; `evidence` says which. Nothing is from memory, and
#     no text is copied from an encyclopaedia.
#   * Where the record is contested, the card says so and does not pick a side.
#   * Ages printed here as ICS ages come from data/timescale.json (chart version 2026-06); Scotese's
#     own map ages come from tools/slices.csv (his Table 1). What a map "shows" was checked on the
#     shipped 1024 x 512 maps (painted ice = pixels with every channel above 200; land = not
#     "blue > max(red, green)"), and paleolatitudes with pygplates and the pinned rotation file.
#   * Units: US first, metric in parentheses. English for a US audience. No AI vendor names.
#   * `placement` (look_for only, not shipped) says how a pin's present-day position was chosen: a
#     point inside the place or region the cited source names, rounded; not a surveyed site.

sources:
