prologue:
  title: "Before 750 million years ago"
  text: "Earth is about 4.54 billion years old. A zircon crystal from the Jack Hills of Western Australia, 4.404 billion years old, is the oldest evidence of continental crust and oceans. Oxygen first built up in the air in the Great Oxidation Event, which began between 2.46 and 2.43 billion years ago. This atlas has no map older than 750 million years, so the story here is told in words."
  sources: [dalrymple2001, wilde2001, gumsley2017, paleoatlas]
  numbers: {"750": paleoatlas, "4.54": dalrymple2001, "4.404": wilde2001, "2.46": gumsley2017, "2.43": gumsley2017}

# One card per Period in data/timescale.json card_periods, youngest first.
periods:
  - ics: Quaternary
    text: "Map 1 is today’s world, the reference for every other map. Map 2 is Scotese’s Last Glacial Maximum, 21,000 years ago, painted white over Canada and northern Europe. Nearly all ice sheets stood at their largest from 26,500 until 19,000–20,000 years ago; then stronger northern summer sunshine started the melt, and meltwater raised the sea. On the map: switch between the two and compare."
    sources: [paleoatlas, clark2009]
    numbers: {"1": paleoatlas, "2": paleoatlas, "21,000": paleoatlas, "26,500": clark2009, "19,000": clark2009, "20,000": clark2009}

  - ics: Neogene
    text: "The continents sit close to where they are today; the changes are at the edges. The Isthmus of Panama formed around 2.8 million years ago, joining North and South America. The review behind that date finds the evidence for a much older isthmus inconclusive. Antarctica is painted white on every Neogene map. On the map: follow the Himalaya pin as India keeps pushing north, and turn on today’s coasts to compare."
    sources: [odea2016, paleoatlas]
    numbers: {"2.8": odea2016}

  - ics: Paleogene
    text: "The Paleogene begins right after the asteroid impact that closed the Cretaceous. About 56 million years ago a vast release of carbon warmed the globe by 9–14 °F (5–8 °C): the Paleocene–Eocene Thermal Maximum. About 34 million years ago permanent ice sheets first formed on Antarctica. India closed on Asia; when their collision began is still argued. On the map: Scotese paints ice on East Antarctica from 44.6 million years ago, earlier than the permanent sheets the rocks date to about 34."
    sources: [mcinerney2011, coxall2005, hu2016, paleoatlas]
    numbers: {"56": mcinerney2011, "9": mcinerney2011, "14": mcinerney2011, "5": mcinerney2011, "8": mcinerney2011, "34": coxall2005, "44.6": paleoatlas}

  - ics: Cretaceous
    text: "Flowering plants appear: water plants from China at least 124.6 million years old already enclose their seeds in carpels. South America and Africa pull apart and the South Atlantic opens. Shallow seas spread over the continents; on the 80.3-million-year map one splits North America in two. The period ends with the Chicxulub impact and the extinction of the non-avian dinosaurs. On the map: India is an island, heading north."
    sources: [sun2002, paleoatlas, schulte2010, renne2013]
    numbers: {"124.6": sun2002, "80.3": paleoatlas}

  - ics: Jurassic
    text: "Pangaea breaks up. Central Atlantic magma, now found across more than 2.7 million square miles (7 million km²) of the Americas, Europe and Africa, peaked about 200 million years ago as the breakup began. Dinosaurs dominated the land for the next 136 million years. Some close relatives of mammals were tiny: one from about 195 million years ago weighed an estimated 2 grams. On the map: a narrow sea opens between North America and Africa."
    sources: [marzoli1999, blackburn2013, luo2001, paleoatlas]
    numbers: {"2.7": marzoli1999, "7": marzoli1999, "200": marzoli1999, "136": blackburn2013, "195": luo2001, "2": luo2001}

  - ics: Triassic
    text: "The Triassic begins just after the most severe extinction of the last 542 million years. Some of the earliest dinosaurs, about 230 million years old, come from northwestern Argentina, where they were already the main hunters and small plant-eaters. A 225-million-year-old skull from Texas was described as the oldest mammal. The period ends with another mass extinction, timed with the first eruptions of a huge lava province. On the map: Pangaea, whole, reaches the South Pole."
    sources: [burgess2014, martinez2011, lucas1993, blackburn2013, paleoatlas]
    numbers: {"542": burgess2014, "230": martinez2011, "225": lucas1993}

  - ics: Permian
    text: "Pangaea is whole: one landmass curving around a great bay of ocean to the east. On these maps the great white sheet in the south shrinks to a small patch by 280 million years ago; the end of this ice age is the only switch from icehouse to greenhouse recorded since plants covered the land. The Permian ends in the most severe extinction known. Estimates of marine species lost run from about 81% to more than 90%. The Siberian Traps eruptions are the leading suspect; how they killed is debated."
    sources: [paleoatlas, montanez2013, montanez2007, burgess2014, stanley2016, burgess2015, bond2017]
    numbers: {"280": paleoatlas, "81": stanley2016, "90": burgess2015}

  - ics: Carboniferous
    text: "Coal forests, the wetland forests of the tropics, began in the Serpukhovian as falling sea level exposed wide shelves, spread late in the Bashkirian, and collapsed early in the Kasimovian, about 305 million years ago. Ice sheets came and went over southern Gondwana in the longest ice age of the last 539 million years. Gondwana’s collision with North America began building Pangaea. On the map: the far south is painted white from 332.5 million years ago."
    sources: [cleal2005, sahney2010, montanez2013, ics, hatcher2010, paleoatlas]
    numbers: {"305": sahney2010, "539": ics, "332.5": paleoatlas}

  - ics: Devonian
    text: "Forests appear. Trees and forests arose in the Middle Devonian, 393–383 million years ago; stumps at Gilboa, New York, belong to tree-fern-like plants at least 26 feet (8 m) tall. A Late Devonian fish from Arctic Canada already had a neck and a wrist, features of four-legged animals. Sea life crashed at the Frasnian–Famennian boundary. On the map: North America and northern Europe side by side, and Gondwana over the South Pole."
    sources: [stein2020, stein2007, daeschler2006, bondwignall2008, paleoatlas]
    numbers: {"393": stein2020, "383": stein2020, "26": stein2007, "8": stein2007}

  - ics: Silurian
    text: "Plants big enough to see appear in the fossil record by the Late Silurian, about 425 million years ago, some 50 million years after the first spores. Continents were colliding in what are now Newfoundland and the Maritime Appalachians. Smaller extinction crises in the Silurian seas are linked to warming and oxygen-poor water. On the map: Africa and South America, then part of Gondwana, lie at high southern latitudes; North America and northern Europe sit close together south of the equator."
    sources: [wellman2003, hatcher2010, bond2017, paleoatlas]
    numbers: {"425": wellman2003, "50": wellman2003}

  - ics: Ordovician
    text: "Sea life multiplied: reefs built by animals, more complex sea-floor communities and much richer plankton. The first land plants left spores about 475 million years ago. The period ended in the Hirnantian with a short, intense glaciation at the South Pole and two pulses of extinction that removed about 85% of marine species, the first of the big five. On the map: Gondwana reaches from the tropics to the South Pole, painted white in the far south on the last two Ordovician maps."
    sources: [servais2010, wellman2003, harper2014, paleoatlas]
    numbers: {"475": wellman2003, "85": harper2014}

  - ics: Cambrian
    text: "The Cambrian begins where burrows of mobile animals appear in the rock. Exactly when is still being refined: Scotese’s atlas uses 542 million years ago, today’s chart 538.8 ± 0.6, and rocks in Namibia 538.6–538.8. Early in the Cambrian many animal groups appear as fossils, apparently within a few million years, though their lineages are tens of millions of years older. On the map: almost all land lies south of the equator, most of it in Gondwana."
    sources: [linnemann2019, paleoatlas, ics, erwin2011]
    numbers: {"542": paleoatlas, "538.8": [ics, linnemann2019], "0.6": ics, "538.6": linnemann2019}

  - ics: Ediacaran
    text: "The first large, complex living things appear: the soft-bodied Ediacara biota, from about 575 million years ago. At Mistaken Point, Newfoundland, the oldest are 574.17 ± 0.66 million years old. Some were early animals; others may have been failed experiments. Later ones could move, and by 550 million years ago some had calcified parts. On the 600-million-year map: white at high latitudes, most of it in the south."
    sources: [narbonne2005, matthews2021, paleoatlas]
    numbers: {"575": narbonne2005, "574.17": matthews2021, "0.66": matthews2021, "550": narbonne2005, "600": paleoatlas}

  - ics: Cryogenian
    text: "Two long ice ages. The first, the Sturtian, lasted from about 717 to 660 million years ago, and its ice reached the sea near the equator. Whether the whole planet froze into a snowball Earth is a hypothesis, built on rocks such as Namibia’s, where glacial deposits are capped by carbonate laid down as the climate flipped to an extreme greenhouse. On the map: Scotese’s 690-million-year map, from the middle of the Sturtian, paints no ice."
    sources: [rooney2015, macdonald2010, hoffman1998, paleoatlas]
    numbers: {"717": rooney2015, "660": rooney2015, "690": paleoatlas}

  - ics: Tonian
    text: "The oldest map in the atlas, 750 million years ago. Rodinia, the supercontinent before Pangaea, later broke apart; its rifted edge, formed from the Neoproterozoic into the early Paleozoic, became the margin of eastern North America. The major animal groups had not yet appeared as fossils. On the map: most land lies within 30° of the equator. East–west positions are the least certain part of a map this old: rock magnetism records latitude, not longitude."
    sources: [paleoatlas, hatcher2010, erwin2011, vanhinsbergen2015]
    numbers: {"750": paleoatlas, "30": paleoatlas}
    measured: {"30": "share of painted land within 30 degrees of the equator on map 93, cos-latitude weighted; 60_story.py re-measures it (claim tonian-land-tropics)"}

# About 25 events. `period` is the ICS Period the event is filed under; 60_story.py checks that the
# chart puts age_ma inside it. `boundary` marks an event dated by the base of that ICS unit.
# `range_ma` [older, younger] means age_ma is its midpoint and age_unc_ma its half-width.
events:
  - id: sturtian
    title: "The Sturtian ice age"
    age_ma: 716.5
    age_source: macdonald2010
    period: Cryogenian
    text: "A volcanic ash bed within glacial deposits in northwestern Canada shows the Sturtian glaciation under way by 716.5 million years ago. The rocks then lay near the equator, so the ice reached the sea at low latitudes."
    sources: [macdonald2010]
    numbers: {"716.5": macdonald2010}

  - id: ediacaran-begins
    title: "The Ediacaran begins"
    age_ma: 635.0
    age_source: ics
    boundary: Ediacaran
    period: Ediacaran
    text: "Today’s chart starts the Ediacaran 635 million years ago, at the end of the Cryogenian. In the snowball hypothesis, a global ice age ends abruptly once volcanoes raise carbon dioxide to about 350 times the modern level."
    sources: [ics, hoffman1998]
    numbers: {"635": ics, "350": hoffman1998}

  - id: ediacara-biota
    title: "The first large, complex life"
    age_ma: 575
    age_source: narbonne2005
    period: Ediacaran
    text: "Soft-bodied organisms far larger and more complex than anything before appear about 575 million years ago. At Mistaken Point, Newfoundland, the oldest are dated to 574.17 ± 0.66 million years."
    sources: [narbonne2005, matthews2021]
    numbers: {"575": narbonne2005, "574.17": matthews2021, "0.66": matthews2021}

  - id: cambrian-base
    title: "The Cambrian begins"
    age_ma: 538.8
    age_unc_ma: 0.6
    age_source: ics
    boundary: Cambrian
    period: Cambrian
    text: "Today’s chart puts the base of the Cambrian at 538.8 ± 0.6 million years ago. Dated rocks in Namibia give 538.6–538.8. Scotese’s atlas, drawn on an older timescale, uses 542."
    sources: [ics, linnemann2019, paleoatlas]
    numbers: {"538.8": [ics, linnemann2019], "0.6": ics, "538.6": linnemann2019, "542": paleoatlas}

  - id: cambrian-explosion
    title: "Burrowing animals take over"
    age_ma: 538.58
    age_unc_ma: 0.19
    age_source: linnemann2019
    period: Cambrian
    text: "In Namibia the last Ediacaran fossils and the first burrows of mobile animals are less than 410,000 years apart, ending 538.58 ± 0.19 million years ago. Through the early Cambrian many animal groups then appear as fossils, apparently within a few million years."
    sources: [linnemann2019, erwin2011]
    numbers: {"410,000": linnemann2019, "538.58": linnemann2019, "0.19": linnemann2019}

  - id: first-land-plants
    title: "The oldest spores of land plants"
    age_ma: 475
    age_source: wellman2003
    period: Ordovician
    text: "The earliest widely accepted spores of land plants come from rocks about 475 million years old. Plant fragments from Ordovician rocks of Oman show they grew in sporangia and point to relatives of liverworts."
    sources: [wellman2003]
    numbers: {"475": wellman2003}

  - id: end-ordovician
    title: "End-Ordovician mass extinction"
    age_ma: 445.2
    age_unc_ma: 0.9
    age_source: ics
    ics_unit: Hirnantian
    period: Ordovician
    text: "In the Hirnantian, the Ordovician’s last age, which begins 445.2 million years ago, a short, intense glaciation at the South Pole came with two pulses of extinction that removed about 85% of marine species."
    sources: [ics, harper2014]
    numbers: {"445.2": ics, "85": harper2014}

  - id: silurian-plants
    title: "Plants big enough to see"
    age_ma: 425
    age_source: wellman2003
    period: Silurian
    text: "Larger fossils of land plants, not just their spores, appear in the Late Silurian, about 425 million years ago, some 50 million years after the oldest spores."
    sources: [wellman2003]
    numbers: {"425": wellman2003, "50": wellman2003}

  - id: first-forests
    title: "The first forests"
    age_ma: 388
    age_unc_ma: 5
    range_ma: [393, 383]
    age_source: stein2020
    period: Devonian
    when: "393–383 million years ago"
    text: "Trees and forests arose in the Middle Devonian. Stumps at Gilboa, New York, belong to tree-fern-like plants at least 26 feet (8 m) tall; nearby Cairo, New York, has the oldest forest yet found."
    sources: [stein2020, stein2007]
    numbers: {"393": stein2020, "383": stein2020, "26": stein2007, "8": stein2007}

  - id: late-devonian
    title: "Late Devonian mass extinction"
    age_ma: 372.15
    age_unc_ma: 0.46
    age_source: ics
    boundary: Famennian
    period: Devonian
    text: "Sea life crashed at the boundary between the Frasnian and Famennian ages, 372.15 million years ago by today’s chart. In Raup and Sepkoski’s 1982 counts it stood out from the background but, unlike the other four, was not statistically significant."
    sources: [ics, bondwignall2008, raup1982]
    numbers: {"372.15": ics, "1982": raup1982}

  - id: coal-forests-begin
    title: "The coal forests begin"
    age_ma: 330.3
    age_unc_ma: 0.4
    age_source: ics
    boundary: Serpukhovian
    period: Carboniferous
    text: "Wetland forests of the tropics began in the Serpukhovian, which today’s chart starts 330.3 million years ago, as falling sea level exposed wide shelves. They spread dramatically late in the Bashkirian."
    sources: [cleal2005, ics]
    numbers: {"330.3": ics}

  - id: pangaea-assembly
    title: "Pangaea comes together"
    age_ma: 330.3
    age_unc_ma: 0.4
    age_source: ics
    ics_unit: UpperMississippian
    period: Carboniferous
    when: "Late Mississippian to Permian"
    text: "From the late Mississippian into the Permian, Gondwana collided with North America, raising the Appalachians and joining the continents into Pangaea. By today’s chart the late Mississippian begins 330.3 million years ago."
    sources: [hatcher2010, ics]
    numbers: {"330.3": ics}

  - id: coal-forests-collapse
    title: "The coal forests collapse"
    age_ma: 305
    age_source: sahney2010
    period: Carboniferous
    text: "Early in the Kasimovian, about 305 million years ago, the tropical coal forests collapsed and shrank by more than half. Among amphibians and reptiles, extinctions peaked and separate local faunas appeared for the first time."
    sources: [sahney2010, cleal2005]
    numbers: {"305": sahney2010}

  - id: end-permian
    title: "End-Permian mass extinction"
    age_ma: 251.902
    age_unc_ma: 0.024
    age_source: ics
    boundary: Triassic
    period: Triassic
    text: "The most severe extinction of the last 542 million years happened between 251.941 and 251.880 million years ago. Estimates of marine species lost run from about 81% to more than 90%. Siberian lava eruptions are the leading suspect."
    sources: [ics, burgess2014, stanley2016, burgess2015]
    numbers: {"542": burgess2014, "251.941": burgess2014, "251.880": burgess2014, "81": stanley2016, "90": burgess2015}

  - id: first-dinosaurs
    title: "Early dinosaurs"
    age_ma: 230
    age_source: martinez2011
    period: Triassic
    text: "About 230 million years ago, in rocks now in northwestern Argentina, the earliest dinosaurs were already the main hunters and small plant-eaters in that part of Pangaea."
    sources: [martinez2011]
    numbers: {"230": martinez2011}

  - id: first-mammals
    title: "One of the oldest mammals"
    age_ma: 225
    age_source: lucas1993
    period: Triassic
    text: "A partial skull from Crosby County, Texas, about 225 million years old, was described as the oldest mammal, at least 10 million years older than any found before. It is too incomplete to place exactly."
    sources: [lucas1993]
    numbers: {"225": lucas1993, "10": lucas1993}

  - id: end-triassic
    title: "End-Triassic mass extinction"
    age_ma: 201.4
    age_unc_ma: 0.2
    age_source: ics
    boundary: Jurassic
    period: Jurassic
    text: "Major losses on land and in the sea. The first eruptions of the Central Atlantic lava province match the extinction in time; the lava came in four pulses over about 600,000 years."
    sources: [ics, blackburn2013]
    numbers: {"600,000": blackburn2013}

  - id: pangaea-breakup
    title: "Pangaea begins to split"
    age_ma: 200
    age_source: marzoli1999
    period: Jurassic
    text: "Central Atlantic magma, now found across more than 2.7 million square miles (7 million km²) on both sides of the Atlantic, peaked about 200 million years ago as Pangaea began to break apart."
    sources: [marzoli1999]
    numbers: {"2.7": marzoli1999, "7": marzoli1999, "200": marzoli1999}

  - id: tiny-mammal
    title: "A mammal relative weighing 2 grams"
    age_ma: 195
    age_source: luo2001
    period: Jurassic
    text: "About 195 million years ago lived a mammal relative with an estimated weight of 2 grams (0.07 ounce). Its middle-ear bones were already separate from the jaw, as in living mammals."
    sources: [luo2001]
    numbers: {"2": luo2001, "195": luo2001, "0.07": luo2001}

  - id: juramaia
    title: "Oldest relative of placental mammals"
    age_ma: 160
    age_source: luo2011
    period: Jurassic
    text: "A 160-million-year-old fossil from China was described as the oldest known member of the group that includes all placental mammals, about 35 million years older than the previous record."
    sources: [luo2011]
    numbers: {"160": luo2011, "35": luo2011}

  - id: first-flowers
    title: "Early flowering plants"
    age_ma: 124.6
    age_source: sun2002
    period: Cretaceous
    text: "Water plants from the Yixian Formation of Liaoning, China, at least 124.6 million years old, enclose their seeds in carpels, as flowering plants do, but have no petals or sepals."
    sources: [sun2002]
    numbers: {"124.6": sun2002}

  - id: chicxulub
    title: "Asteroid impact at Chicxulub"
    age_ma: 66.0
    age_source: ics
    boundary: Paleogene
    period: Paleogene
    text: "An asteroid struck what is now Mexico’s Yucatán Peninsula. Its debris forms a single layer found worldwide at the Cretaceous–Paleogene boundary, and dating puts the impact within 32,000 years of the extinction."
    sources: [ics, hildebrand1991, schulte2010, renne2013]
    numbers: {"32,000": renne2013}

  - id: end-cretaceous
    title: "End-Cretaceous mass extinction"
    age_ma: 66.0
    age_source: ics
    boundary: Paleogene
    period: Paleogene
    text: "One of the three largest extinctions of the last 500 million years ended the non-avian dinosaurs. A synthesis of the boundary rocks concludes the impact triggered it; the Deccan lava eruptions in India overlapped it, and how much they added is still debated."
    sources: [ics, schulte2010, renne2013, schoene2019, sprain2019]
    numbers: {"500": schulte2010}

  - id: petm
    title: "Paleocene–Eocene Thermal Maximum"
    age_ma: 56.0
    age_source: ics
    boundary: Eocene
    period: Paleogene
    text: "Thousands of billions of metric tons of carbon entered the ocean and air in less than 20,000 years, and global temperature rose 9–14 °F (5–8 °C). The whole event lasted about 200,000 years."
    sources: [ics, mcinerney2011]
    numbers: {"20,000": mcinerney2011, "9": mcinerney2011, "14": mcinerney2011, "5": mcinerney2011, "8": mcinerney2011, "200,000": mcinerney2011}

  - id: antarctic-ice
    title: "Ice sheets form on Antarctica"
    age_ma: 33.9
    age_source: ics
    boundary: Oligocene
    period: Paleogene
    text: "Near the Eocene–Oligocene boundary, about 34 million years ago, permanent ice sheets first appeared on Antarctica, growing in two rapid steps."
    sources: [ics, coxall2005]
    numbers: {"34": coxall2005}

  - id: panama
    title: "The Isthmus of Panama forms"
    age_ma: 2.8
    age_source: odea2016
    period: Neogene
    text: "A review of geological, fossil and genetic evidence puts the formation of the Isthmus of Panama around 2.8 million years ago, and finds the case for a much older isthmus inconclusive."
    sources: [odea2016]
    numbers: {"2.8": odea2016}

  - id: last-glacial-maximum
    title: "The Last Glacial Maximum"
    age_ma: 0.023
    age_unc_ma: 0.0035
    range_ma: [0.0265, 0.0195]
    age_source: clark2009
    period: Quaternary
    when: "26,500 to 19,000–20,000 years ago"
    text: "Nearly all ice sheets stood at their largest from 26,500 years ago until 19,000–20,000 years ago, when stronger northern summer sunshine began the melt."
    sources: [clark2009]
    numbers: {"26,500": clark2009, "19,000": clark2009, "20,000": clark2009}

# Pins that ride their plate. Positions are present-day; 60_story.py partitions each with Scotese's
# polygons at 0 Ma (as places.json does) and checks the claimed `plate`, and that the plate's crust
# is carried back over the whole window. window_ma: [older, younger], shown while younger <= age <= older.
look_for:
  - id: yukon
    label: "Glacial rocks, Yukon"
    text: "Rocks now in northwestern Canada hold glacial deposits 716.5 million years old, laid down near the equator."
    lon: -138.0
    lat: 64.5
    window_ma: [750, 690]
    plate: 124
    placement: "a point in the Yukon, the northwestern Canada the source names"
    sources: [macdonald2010]
    numbers: {"716.5": macdonald2010}

  - id: mistaken-point
    label: "Mistaken Point fossils"
    text: "Some of the oldest large, complex fossils, 574 million years old and younger, lie on rock surfaces here in Newfoundland."
    lon: -53.3
    lat: 46.75
    window_ma: [600, 540]
    plate: 108
    placement: "a point on the southern Avalon Peninsula near Mistaken Point, moved inland so it falls on Natural Earth 1:50m land"
    sources: [matthews2021]
    numbers: {"574": matthews2021}

  - id: namibia
    label: "Boundary rocks, Namibia"
    text: "A section in Namibia dates the change from Ediacaran life to Cambrian burrowers to 538.99–538.58 million years ago."
    lon: 17.0
    lat: -22.0
    window_ma: [545, 533]
    plate: 701
    placement: "a point in central Namibia; the source names the country, not the site"
    sources: [linnemann2019]
    numbers: {"538.99": linnemann2019, "538.58": linnemann2019}

  - id: oman
    label: "Earliest plant fragments"
    text: "Spore-bearing fragments of early land plants, probably related to liverworts, come from Ordovician rocks now in Oman."
    lon: 57.0
    lat: 21.0
    window_ma: [480, 445]
    plate: 503
    placement: "a point in central Oman; the source names the country, not the site"
    sources: [wellman2003]
    numbers: {}

  - id: appalachians
    label: "Appalachians"
    text: "Raised by collisions in the Ordovician, the Devonian and, as Pangaea assembled, from the late Mississippian into the Permian."
    lon: -79.0
    lat: 38.0
    window_ma: [480, 250]
    plate: 101
    placement: "a point in the Valley and Ridge of Virginia, inside the mountain belt"
    sources: [hatcher2010]
    numbers: {}

  - id: gilboa
    label: "Gilboa fossil forest"
    text: "Stumps of some of the earliest trees, tree-fern-like plants at least 26 feet (8 m) tall, stand in rock at Gilboa, New York."
    lon: -74.4
    lat: 42.4
    window_ma: [395, 380]
    plate: 101
    placement: "the village of Gilboa, Schoharie County, New York, rounded to 0.1°"
    sources: [stein2007]
    numbers: {"26": stein2007, "8": stein2007}

  - id: siberian-traps
    label: "Siberian Traps"
    text: "The leading suspect for the end-Permian extinction: lava erupted here before, during and after it, and magma intruded underground from its start."
    lon: 95.0
    lat: 67.0
    window_ma: [256, 248]
    plate: 401
    placement: "a point in the central Siberian lava plateau, rounded to whole degrees"
    sources: [burgess2015]
    numbers: {}

  - id: meishan
    label: "Meishan, China"
    text: "The reference section for the Permian–Triassic boundary; its ash beds date the extinction to an interval of 60,000 ± 48,000 years."
    lon: 119.7
    lat: 31.1
    window_ma: [256, 248]
    plate: 611
    placement: "Meishan, Changxing County, Zhejiang, rounded to 0.1°"
    sources: [burgess2014]
    numbers: {"60,000": burgess2014, "48,000": burgess2014}

  - id: ischigualasto
    label: "Ischigualasto, Argentina"
    text: "Rocks of the Ischigualasto Formation hold some of the earliest dinosaurs, about 230 million years old."
    lon: -67.9
    lat: -30.0
    window_ma: [235, 225]
    plate: 291
    placement: "a point in the Ischigualasto basin, San Juan Province, rounded to 0.1°"
    sources: [martinez2011]
    numbers: {"230": martinez2011}

  - id: crosby-county
    label: "Oldest mammal, Texas"
    text: "A skull about 225 million years old from Crosby County, Texas, described as the oldest mammal."
    lon: -101.3
    lat: 33.6
    window_ma: [230, 220]
    plate: 101
    placement: "a point in Crosby County, Texas, rounded to 0.1°"
    sources: [lucas1993]
    numbers: {"225": lucas1993}

  - id: camp-brazil
    label: "Atlantic magma, Brazil"
    text: "Central Atlantic province magma extends over about 965,000 square miles (2.5 million km²) of north and central Brazil."
    lon: -50.0
    lat: -6.0
    window_ma: [205, 195]
    plate: 201
    placement: "a point in north-central Brazil (Pará); the source gives the region, not a site"
    sources: [marzoli1999]
    numbers: {"965,000": marzoli1999, "2.5": marzoli1999}

  - id: liaoning
    label: "Yixian Formation, China"
    text: "Water plants at least 124.6 million years old, among the earliest flowering plants, come from these rocks."
    lon: 120.5
    lat: 41.5
    window_ma: [130, 120]
    plate: 604
